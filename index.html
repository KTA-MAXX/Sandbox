        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Central</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fff9e6 0%, #ffe066 50%, #ffcc00 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #3d2b00;
            padding: 20px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 0 #fff3b0;
            letter-spacing: -0.5px;
        }

        .img-btn {
            display: inline-block;
            padding: 12px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .img-btn:hover {
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.18);
        }

        .img-btn img {
            display: block;
            border-radius: 12px;
            width: 80px;
            height: 80px;
            object-fit: cover;
        }

        .subtitle {
            margin-top: 1.8rem;
            font-size: 1.15rem;
            opacity: 0.85;
            max-width: 400px;
            line-height: 1.5;
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 0.8rem;
            display: block;
        }
    </style>
</head>
<body>

    <span class="emoji">🍌</span>
    <h1>Banana Central is the best banana</h1>

    <a href="https://bananarepublic.gapcanada.ca/" target="_blank" rel="noopener" class="img-btn">
        <img src="image.png" alt="Banana Republic">
    </a>

    <p class="subtitle">Click the logo above to visit Banana Republic</p>
